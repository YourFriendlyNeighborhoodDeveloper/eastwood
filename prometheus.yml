global:
  scrape_interval: 15s

# Scrapes both services on the internal compose network. Neither /metrics
# endpoint is proxied by nginx to the public edge.
scrape_configs:
  - job_name: eastwood-core
    metrics_path: /metrics
    static_configs:
      - targets: ["eastwood-core:8080"]
  - job_name: ai-agent
    metrics_path: /metrics
    static_configs:
      - targets: ["ai-agent:8081"]
