server {
    listen 80;

    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    # Webhook and API payloads are small; anything bigger is not ours.
    client_max_body_size 1m;

    # Forwarded headers are OVERWRITTEN at this edge, never passed through from
    # the client — eastwood-core treats them as trusted-proxy values when
    # reconstructing the URL Twilio signed.

    location /api/ {
        set $upstream_core http://eastwood-core:8080;
        proxy_pass $upstream_core;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /twiml/ {
        set $upstream_core http://eastwood-core:8080;
        proxy_pass $upstream_core;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Twilio terminal-status callbacks (POST /twilio/status/{session_id}).
    location /twilio/ {
        set $upstream_core http://eastwood-core:8080;
        proxy_pass $upstream_core;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # ai-agent: ONLY the Twilio media stream is public. Session administration
    # (/sessions, /sessions/{id}/end), /health, and /metrics stay on the
    # internal Docker network — eastwood-core reaches ai-agent directly.
    location ~ ^/agent/sessions/[^/]+/media$ {
        set $upstream_agent http://ai-agent:8081;
        rewrite ^/agent/(.*)$ /$1 break;
        proxy_pass $upstream_agent;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_http_version 1.1;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /agent/ {
        return 404;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
