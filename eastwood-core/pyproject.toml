[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eastwood-core"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.29.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.0",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29.0",
  "alembic>=1.13.0",
  "redis[hiredis]>=5.0.4",
  "aiokafka>=0.11.0",
  "httpx>=0.27.0",
  "phonenumbers>=8.13.0",
  "prometheus-client>=0.21.0",
  "structlog>=24.2.0",
  "tenacity>=8.3.0",
  "twilio>=9.1.0",
  "cryptography>=42.0.0",
  "orjson>=3.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
