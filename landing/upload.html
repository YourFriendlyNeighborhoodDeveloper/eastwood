<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eastwood — Lead Uploader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
    .gold-text {
      background: linear-gradient(135deg, #e8c14a 0%, #f0a030 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .gold-bar {
      background: linear-gradient(90deg, #e8c14a, #f0a030);
    }
    .green-bar { background: #22c55e; }
    .mixed-bar {
      background: linear-gradient(90deg, #22c55e 0%, #f0a030 100%);
    }
  </style>
</head>
<body style="background:#0a0a0a; color:#f0f0f0; margin:0;">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useCallback, useEffect } = React;

    const API_URL = "/api/leads/ingest";
    const CONCURRENCY = 5;

    // Matches ingest_csv.py logic exactly
    function extractPhone(row) {
      for (const key of ["Other Phone 1", "Mobile", "Home", "Work"]) {
        const val = (row[key] || "").trim();
        if (val) return val.startsWith("+") ? val : `+1${val}`;
      }
      return null;
    }

    function buildLead(row) {
      const phone = extractPhone(row);
      const state = (row["State"] || "").trim();
      if (!phone || !state) return null;

      const lead = { phone, state, source: "csv_import" };
      const firstName = (row["First Name"] || "").trim();
      const lastName  = (row["Last Name"]  || "").trim();
      const ageStr    = (row["Age"]        || "").trim();
      const email     = (row["Email"]      || "").trim();

      if (firstName) lead.first_name = firstName;
      if (lastName)  lead.last_name  = lastName;
      if (email)     lead.email      = email;
      if (ageStr) {
        const age = parseInt(ageStr, 10);
        if (!isNaN(age)) lead.age = age;
      }
      return lead;
    }

    async function postLead(lead) {
      const resp = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(lead),
      });
      if (!resp.ok) {
        let msg = `HTTP ${resp.status}`;
        try { msg = (await resp.json()).detail || msg; } catch {}
        throw new Error(msg);
      }
      const data = await resp.json();
      if (data.status !== "accepted") throw new Error(data.error || "rejected");
    }

    // ── Sub-components ────────────────────────────────────────────────────

    function UploadIcon({ active }) {
      return (
        <svg
          className="w-12 h-12 transition-colors duration-200"
          style={{ color: active ? "#e8c14a" : "#444" }}
          fill="none" stroke="currentColor" viewBox="0 0 24 24"
        >
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.25}
            d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
        </svg>
      );
    }

    function DropZone({ onFile, disabled }) {
      const [dragging, setDragging] = useState(false);
      const inputRef = useRef();

      const handleDrop = useCallback((e) => {
        e.preventDefault();
        setDragging(false);
        if (disabled) return;
        const file = e.dataTransfer.files[0];
        if (file?.name.endsWith(".csv")) onFile(file);
      }, [onFile, disabled]);

      const handleChange = (e) => {
        const file = e.target.files[0];
        if (file) onFile(file);
        e.target.value = "";
      };

      const borderColor = disabled ? "#1f1f1f"
        : dragging ? "#e8c14a66"
        : "#2a2a2a";
      const bg = disabled ? "#0f0f0f"
        : dragging ? "#1a1600"
        : "#111";

      return (
        <div
          onClick={() => !disabled && inputRef.current.click()}
          onDragOver={(e) => { e.preventDefault(); if (!disabled) setDragging(true); }}
          onDragLeave={() => setDragging(false)}
          onDrop={handleDrop}
          style={{
            border: `2px dashed ${borderColor}`,
            background: bg,
            borderRadius: 14,
            padding: "48px 24px",
            display: "flex",
            flexDirection: "column",
            alignItems: "center",
            gap: 12,
            cursor: disabled ? "not-allowed" : "pointer",
            opacity: disabled ? 0.45 : 1,
            transition: "border-color 0.2s, background 0.2s",
            userSelect: "none",
          }}
        >
          <input ref={inputRef} type="file" accept=".csv" onChange={handleChange} style={{ display: "none" }} />
          <UploadIcon active={dragging} />
          <div style={{ textAlign: "center" }}>
            <p style={{ fontSize: 15, fontWeight: 500, color: dragging ? "#e8c14a" : "#ccc", margin: 0 }}>
              {dragging ? "Release to upload" : "Drop a CSV file here"}
            </p>
            <p style={{ fontSize: 13, color: "#555", marginTop: 4 }}>or click to browse</p>
          </div>
          <p style={{ fontSize: 11, color: "#3a3a3a", marginTop: 4, fontFamily: "monospace" }}>
            Columns: First Name · Last Name · Age · State · Email · Mobile / Home / Work / Other Phone 1
          </p>
        </div>
      );
    }

    function ResultRow({ result, index }) {
      const { status, lead, error } = result;
      const name = [lead?.first_name, lead?.last_name].filter(Boolean).join(" ") || "—";
      const ok = status === "accepted";
      return (
        <div style={{
          display: "flex",
          alignItems: "center",
          gap: 10,
          padding: "6px 0",
          borderBottom: "1px solid #1c1c1c",
          fontFamily: "ui-monospace, monospace",
          fontSize: 12,
          lineHeight: 1.4,
          animation: "fadeIn 0.15s ease",
        }}>
          <span style={{ color: ok ? "#4ade80" : "#f87171", width: 14, flexShrink: 0, fontWeight: 700 }}>
            {ok ? "✓" : "✗"}
          </span>
          <span style={{ color: ok ? "#e2e2e2" : "#666", minWidth: 0, flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
            {name}
          </span>
          {ok && lead?.phone && (
            <span style={{ color: "#444", fontSize: 11, flexShrink: 0 }}>{lead.phone}</span>
          )}
          {!ok && error && (
            <span style={{ color: "#ef4444aa", fontSize: 11, flexShrink: 0, marginLeft: "auto" }}>{error}</span>
          )}
        </div>
      );
    }

    function ProgressBar({ value, phase, hasFailed }) {
      const cls = phase === "done"
        ? (hasFailed ? "mixed-bar" : "green-bar")
        : "gold-bar";
      return (
        <div style={{ height: 3, background: "#1e1e1e", borderRadius: 99, overflow: "hidden" }}>
          <div
            className={cls}
            style={{ height: "100%", width: `${value}%`, borderRadius: 99, transition: "width 0.3s ease" }}
          />
        </div>
      );
    }

    // ── Main App ──────────────────────────────────────────────────────────

    function App() {
      const [phase, setPhase]       = useState("idle");      // idle | processing | done
      const [results, setResults]   = useState([]);
      const [total, setTotal]       = useState(0);
      const [skipped, setSkipped]   = useState(0);
      const [filename, setFilename] = useState("");
      const logRef = useRef();

      // Auto-scroll log
      useEffect(() => {
        if (logRef.current) logRef.current.scrollTop = logRef.current.scrollHeight;
      }, [results]);

      const accepted = results.filter(r => r.status === "accepted").length;
      const failed   = results.filter(r => r.status === "failed").length;
      const done     = accepted + failed;
      const progress = total > 0 ? Math.round((done / total) * 100) : 0;

      const handleFile = useCallback(async (file) => {
        setFilename(file.name);
        setPhase("processing");
        setResults([]);
        setTotal(0);
        setSkipped(0);

        Papa.parse(file, {
          header: true,
          skipEmptyLines: true,
          complete: async ({ data: rows }) => {
            let skippedCount = 0;
            const leads = rows.map(row => {
              const lead = buildLead(row);
              if (!lead) { skippedCount++; return null; }
              return lead;
            }).filter(Boolean);

            setTotal(leads.length);
            setSkipped(skippedCount);

            for (let i = 0; i < leads.length; i += CONCURRENCY) {
              const batch = leads.slice(i, i + CONCURRENCY);
              await Promise.all(batch.map(async (lead) => {
                let result;
                try {
                  await postLead(lead);
                  result = { status: "accepted", lead };
                } catch (e) {
                  result = { status: "failed", lead, error: e.message };
                }
                setResults(prev => [...prev, result]);
              }));
            }

            setPhase("done");
          },
          error: () => setPhase("idle"),
        });
      }, []);

      const reset = () => {
        setPhase("idle");
        setResults([]);
        setTotal(0);
        setSkipped(0);
        setFilename("");
      };

      return (
        <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column" }}>

          {/* Nav */}
          <nav style={{
            borderBottom: "1px solid #1c1c1c",
            padding: "14px 24px",
            display: "flex",
            alignItems: "center",
            gap: 16,
          }}>
            <a href="/" style={{ color: "#555", textDecoration: "none", fontSize: 13, display: "flex", alignItems: "center", gap: 5 }}
              onMouseEnter={e => e.currentTarget.style.color = "#888"}
              onMouseLeave={e => e.currentTarget.style.color = "#555"}
            >
              <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" />
              </svg>
              Back
            </a>
            <span className="gold-text" style={{ fontWeight: 800, fontSize: 18, letterSpacing: "-0.02em" }}>
              Eastwood
            </span>
            <span style={{ color: "#333", fontSize: 13 }}>/ Lead Uploader</span>
          </nav>

          {/* Content */}
          <main style={{ flex: 1, display: "flex", justifyContent: "center", padding: "40px 24px" }}>
            <div style={{ width: "100%", maxWidth: 600, display: "flex", flexDirection: "column", gap: 20 }}>

              {/* Drop zone */}
              <DropZone onFile={handleFile} disabled={phase === "processing"} />

              {/* Progress */}
              {phase !== "idle" && total > 0 && (
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, color: "#555", fontFamily: "monospace" }}>
                    <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", maxWidth: "80%" }}>{filename}</span>
                    <span>{done}/{total}</span>
                  </div>
                  <ProgressBar value={progress} phase={phase} hasFailed={failed > 0} />
                </div>
              )}

              {/* Live log */}
              {results.length > 0 && (
                <div
                  ref={logRef}
                  style={{
                    background: "#0e0e0e",
                    border: "1px solid #1e1e1e",
                    borderRadius: 12,
                    padding: "12px 16px",
                    maxHeight: 300,
                    overflowY: "auto",
                  }}
                >
                  {results.map((r, i) => <ResultRow key={i} result={r} index={i} />)}
                </div>
              )}

              {/* Summary card */}
              {phase === "done" && (
                <div style={{
                  background: "#0e0e0e",
                  border: "1px solid #1e1e1e",
                  borderRadius: 12,
                  padding: 24,
                  animation: "fadeIn 0.2s ease",
                }}>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 16, textAlign: "center" }}>
                    {[
                      { label: "Total",    value: total,    color: "#e2e2e2" },
                      { label: "Accepted", value: accepted, color: "#4ade80" },
                      { label: "Failed",   value: failed,   color: failed > 0 ? "#f87171" : "#555" },
                    ].map(({ label, value, color }) => (
                      <div key={label}>
                        <p style={{ fontSize: 32, fontWeight: 700, color, margin: 0, lineHeight: 1 }}>{value}</p>
                        <p style={{ fontSize: 11, color: "#555", marginTop: 6, textTransform: "uppercase", letterSpacing: "0.08em" }}>{label}</p>
                      </div>
                    ))}
                  </div>

                  {skipped > 0 && (
                    <p style={{ textAlign: "center", fontSize: 12, color: "#444", marginTop: 16 }}>
                      {skipped} row{skipped !== 1 ? "s" : ""} skipped — missing phone or state
                    </p>
                  )}

                  <button
                    onClick={reset}
                    style={{
                      marginTop: 20,
                      width: "100%",
                      padding: "10px 0",
                      background: "#1a1a1a",
                      border: "1px solid #2a2a2a",
                      borderRadius: 8,
                      color: "#aaa",
                      fontSize: 13,
                      fontWeight: 500,
                      cursor: "pointer",
                      transition: "background 0.15s, color 0.15s",
                    }}
                    onMouseEnter={e => { e.currentTarget.style.background = "#222"; e.currentTarget.style.color = "#ddd"; }}
                    onMouseLeave={e => { e.currentTarget.style.background = "#1a1a1a"; e.currentTarget.style.color = "#aaa"; }}
                  >
                    Upload another file
                  </button>
                </div>
              )}

            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>

  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</body>
</html>
