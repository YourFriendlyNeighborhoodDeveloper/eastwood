<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eastwood — AI-Powered Insurance Sales</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0a0a;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .hero {
      text-align: center;
      max-width: 680px;
      padding: 2rem;
    }
    .logo {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #e8c14a 0%, #f0a030 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1rem;
    }
    .tagline {
      font-size: 1.25rem;
      color: #888;
      margin-bottom: 3rem;
    }
    .badges {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .badge {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 9999px;
      padding: 0.4rem 1rem;
      font-size: 0.85rem;
      color: #aaa;
    }
    .status {
      margin-top: 3rem;
      font-size: 0.8rem;
      color: #444;
    }
    .dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: #22c55e;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div class="hero">
    <div class="logo">Eastwood</div>
    <p class="tagline">AI-powered lead intelligence &amp; voice sales automation</p>
    <div class="badges">
      <span class="badge">TCPA Compliant</span>
      <span class="badge">Real-time Scoring</span>
      <span class="badge">XState Voice Agent</span>
      <span class="badge">FEC + NPI Enrichment</span>
    </div>
    <p class="status"><span class="dot"></span>System operational</p>
    <a href="/upload.html" style="display:inline-block;margin-top:2rem;padding:0.5rem 1.25rem;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#888;font-size:0.85rem;text-decoration:none;transition:border-color 0.2s,color 0.2s"
       onmouseover="this.style.borderColor='#555';this.style.color='#ccc'"
       onmouseout="this.style.borderColor='#333';this.style.color='#888'">
      Upload Leads →
    </a>
  </div>
</body>
</html>
