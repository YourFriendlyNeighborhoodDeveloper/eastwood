services:
  kafka:
    image: bitnami/kafka:3.7
    restart: unless-stopped
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  kafka-init:
    image: bitnami/kafka:3.7
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: >
      bash -lc "
      /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic leads.raw --partitions 3 --replication-factor 1 &&
      /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic leads.normalized --partitions 3 --replication-factor 1 &&
      /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic leads.validated --partitions 3 --replication-factor 1 &&
      /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic leads.scored --partitions 3 --replication-factor 1 &&
      /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic leads.routed --partitions 3 --replication-factor 1 &&
      /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic agent.events --partitions 3 --replication-factor 1 &&
      /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic consent.events --partitions 3 --replication-factor 1 &&
      /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic dlq.events --partitions 3 --replication-factor 1 &&
      /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic calls.field_captured --partitions 3 --replication-factor 1 &&
      /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic calls.quote_requested --partitions 3 --replication-factor 1 &&
      /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic calls.quote_ready --partitions 3 --replication-factor 1 &&
      /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic calls.quote_presented --partitions 3 --replication-factor 1 &&
      /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic calls.objection_captured --partitions 3 --replication-factor 1 &&
      /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic calls.consent_captured --partitions 3 --replication-factor 1 &&
      /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic calls.dnc_requested --partitions 3 --replication-factor 1 &&
      /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic calls.live_transfer_requested --partitions 3 --replication-factor 1 &&
      /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic calls.ended --partitions 3 --replication-factor 1 &&
      echo 'Kafka topics ready.'"
    restart: "no"

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: eastwood
      POSTGRES_USER: eastwood
      POSTGRES_PASSWORD: eastwood
      POSTGRES_MULTIPLE_DATABASES: eastwood,agent
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-multiple-postgres-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh:ro

  redis:
    image: redis:7
    restart: unless-stopped

  prometheus:
    image: prom/prometheus
    restart: unless-stopped
    ports:
      - "19090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "13000:3000"

  eastwood-core:
    image: eastwood-core
    build: ./eastwood-core
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      redis:
        condition: service_started
    ports:
      - "18080:8080"
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+asyncpg://eastwood:eastwood@postgres:5432/eastwood
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      AI_AGENT_BASE_URL: http://ai-agent:8081
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      EASTWOOD_TWILIO_ACCOUNT_SID: ${EASTWOOD_TWILIO_ACCOUNT_SID:-}
      EASTWOOD_TWILIO_AUTH_TOKEN: ${EASTWOOD_TWILIO_AUTH_TOKEN:-}
      EASTWOOD_TWILIO_FROM_NUMBER: ${EASTWOOD_TWILIO_FROM_NUMBER:-}
      SCORE_HOT_THRESHOLD: ${SCORE_HOT_THRESHOLD:-75}
      BYPASS_TCPA: ${BYPASS_TCPA:-false}
      RESET_RATE_TABLE_ON_BOOT: ${RESET_RATE_TABLE_ON_BOOT:-false}
      CMS_MA_DATASET_ID: ${CMS_MA_DATASET_ID:-pjlv-rqvd}
      CMS_MS_DATASET_ID: ${CMS_MS_DATASET_ID:-}
      CMS_TARGET_CARRIERS: ${CMS_TARGET_CARRIERS:-aetna,humana,cvs}
      QUOTE_TIMEOUT_SECONDS: ${QUOTE_TIMEOUT_SECONDS:-6.0}
      DNC_TEST_ALLOWLIST: ${DNC_TEST_ALLOWLIST:-}
      TWILIO_SIGNATURE_VALIDATION_ENABLED: ${TWILIO_SIGNATURE_VALIDATION_ENABLED:-true}
      EASTWOOD_API_KEY: ${EASTWOOD_API_KEY:-}


  ai-agent:
    image: ai-agent
    build: ./ai-agent
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_started
    ports:
      - "18081:8081"
    environment:
      NODE_ENV: production
      AGENT_DATABASE_URL: postgresql://eastwood:eastwood@postgres:5432/agent
      KAFKA_BROKERS: kafka:9092
      EASTWOOD_CORE_BASE_URL: http://eastwood-core:8080
      EASTWOOD_API_KEY: ${EASTWOOD_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      REALTIME_MODEL: gpt-realtime-2
      REALTIME_VOICE: shimmer
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      EASTWOOD_TWILIO_ACCOUNT_SID: ${EASTWOOD_TWILIO_ACCOUNT_SID:-}
      EASTWOOD_TWILIO_AUTH_TOKEN: ${EASTWOOD_TWILIO_AUTH_TOKEN:-}
      EASTWOOD_TWILIO_FROM_NUMBER: ${EASTWOOD_TWILIO_FROM_NUMBER:-}
      SCORE_HOT_THRESHOLD: ${SCORE_HOT_THRESHOLD:-75}
      BYPASS_TCPA: ${BYPASS_TCPA:-false}
      

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    depends_on:
      - eastwood-core
      - ai-agent
    ports:
      - "18000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./landing:/usr/share/nginx/html:ro

volumes:
  pgdata:
